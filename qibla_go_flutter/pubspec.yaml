name: qibla_go_flutter
description: Qibla Go. A free, ad-free Qibla compass and prayer-times app.
publish_to: 'none'

# Build name + build number. Android: versionName/versionCode. iOS:
# CFBundleShortVersionString/CFBundleVersion.
version: 0.1.0+1

environment:
  sdk: '^3.12.2'
  flutter: '^3.44.4'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State and navigation.
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Sensors and location. compass_max is vendored (see packages/compass_max).
  compass_max:
    path: ../packages/compass_max
  geolocator: ^14.1.2

  # Pure-Dart qibla geometry and WMM2025 declination. Pinned exactly: its
  # numbers are what the needle points with. Bump only with the tests in
  # test/core/geo passing.
  qibla_math: 0.1.0

  # Map view (raster tiles; provider configurable via QIBLA_TILE_URL).
  flutter_map: ^8.3.2
  latlong2: ^0.9.1

  # Persistence (last location, preferences) and web sensor interop.
  shared_preferences: ^2.5.6
  web: ^1.1.2
  intl: ^0.20.2

  # Serverpod client (prayer-time sync later).
  qibla_go_client:
    path: ../qibla_go_client
  serverpod_flutter: 4.0.4

  # Store rating prompt (Google Play In-App Review, StoreKit). Shown once,
  # after real use; see features/rating and docs/DECISIONS.md.
  in_app_review: ^2.0.12

dev_dependencies:
  # Used for agents to drive the app through the Dart MCP
  flutter_driver:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/config.json

  # Fonts are bundled, not fetched at runtime: the app must look right offline.
  fonts:
    - family: Marcellus
      fonts:
        - asset: assets/fonts/Marcellus-Regular.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    # Not a real Roboto. Flutter's web engine downloads Roboto from Google
    # Fonts at start-up unless a family by that name is bundled; pointing
    # the name at Manrope keeps start-up offline and free of that request.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
