name: qibla_go_server
description: Qibla Go backend. Serves prayer-time data for offline sync; no user accounts.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  serverpod: 4.0.4

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.0.4
  test: ^1.25.5

serverpod:
  scripts:
    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    # On failure, clean and retry once to clear stale Flutter build caches.
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\qibla_go_flutter
        & set ARGS=web --base-href /
        && (call flutter build %ARGS% || (flutter clean && call flutter build %ARGS%))
        && xcopy /E /I /Y build\web ..\qibla_go_server\web\app
      posix: |
        rm -rf ../qibla_go_server/web/app
        cd ../qibla_go_flutter
        set -- web --base-href / --output ../qibla_go_server/web/app
        flutter build "$@" || { flutter clean && flutter build "$@"; }

  # Companion Flutter apps that `serverpod start` can launch (Ctrl+R).
  # All non-reserved properties are forwarded to `flutter run`.
  flutter_apps:
    qibla_go:
      path: ../qibla_go_flutter
      displayName: "Qibla go app"
      auto_launch: true
      target: lib/driver.dart
